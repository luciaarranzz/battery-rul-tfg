# Configuración del pipeline. train.py y evaluate.py leen este fichero.

seed: 42

data:
  # "nasa" usa el dataset real (src/data/nasa_loader.py), ya descargado en
  # data/raw/cleaned_dataset/. Cambia a "synthetic" para comprobar el
  # pipeline rápido sin depender del dataset real (src/data/synthetic.py).
  source: nasa
  raw_dir: data/raw/cleaned_dataset
  # Parámetros del generador sintético (solo se usan si source: synthetic).
  n_batteries: 24
  n_cycles: 300
  eol_threshold: 0.80        # umbral de fin de vida (80% de la capacidad del primer ciclo)
  # Baterías reservadas para test (por id). Una por cada grupo experimental
  # del dataset NASA (05-06-07-18, 25-28, 29-32, 33-34-36, 38-40, 41-44,
  # 45-48, 49-52, 53-56), para que el test cubra condiciones distintas
  # (~25% de las 34 baterías disponibles).
  test_batteries: ["B0018", "B0028", "B0032", "B0036", "B0040", "B0044", "B0048", "B0052", "B0056"]

target: soh                   # "soh" o "rul"

models:
  random_forest:
    n_estimators: 300
    max_depth: 12
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
  lstm:
    hidden_size: 64
    n_layers: 1
    sequence_length: 5
    epochs: 80
    lr: 0.005
    batch_size: 64

output:
  results_dir: results
